<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Icons</title>
  <style>
    html, body { margin: 0; background: #d8ccb4; color: #2a2220; font-family: 'DotGothic16', monospace; }
    body { padding: 12px 14px 24px; }
    h2 { margin: 14px 0 8px; font-size: 18px; font-weight: normal; letter-spacing: 1px; }
    h2 span { font-size: 12px; opacity: 0.6; margin-left: 8px; }
    .grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .card { display: flex; flex-direction: column; border: 2px solid #2a2220; background: #2a2220; }
    .card .name { font-size: 12px; color: #f3e9d2; padding: 1px 6px 2px; }
    .card .row { display: flex; }
    .bg { display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px; }
    .bg.light { background: #f3e9d2; }
    .bg.dark { background: #3a2f2a; }
    .px-icon { display: block; image-rendering: pixelated; }
    .bar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .slot { width: 64px; height: 64px; display: grid; place-items: center; background: rgba(26, 18, 22, 0.72); border: 3px solid #f3e9d2; box-shadow: 0 0 0 3px #1a1216; }
    .slot.sel { border-color: #ffd23f; }
    .shopcard { width: 150px; background: #f3e9d2; border: 3px solid #2a2220; box-shadow: 0 0 0 3px #f3e9d2, 0 0 0 6px #2a2220; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
    .shopcard .price { display: flex; align-items: center; gap: 4px; color: #9a2a1e; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; background: #f3e9d2; border: 3px solid #2a2220; font-size: 14px; }
    #missing { color: #b0201a; font-size: 13px; white-space: pre-wrap; }
    #err { position: fixed; top: 0; left: 0; color: #c00; white-space: pre; font-size: 12px; }
  </style>
</head>
<body>
  <div id="missing"></div>
  <div id="root"></div>
  <div id="err"></div>
  <script type="module" src="/src/dev/icons.js"></script>
</body>
</html>
