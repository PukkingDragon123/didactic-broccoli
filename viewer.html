<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a2622; color: #f3e9d2; font-family: 'DotGothic16', monospace; overflow: hidden; }
    canvas { display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .lbl { position: absolute; transform: translateX(-50%); text-align: center; font-size: 13px; line-height: 1.2; text-shadow: 0 1px 0 #000; white-space: nowrap; }
    .lbl .r { font-size: 11px; opacity: 0.85; }
    #err { position: absolute; top: 0; left: 0; color: #ff8080; white-space: pre; font-size: 12px; }
  </style>
</head>
<body>
  <div id="labels"></div>
  <div id="err"></div>
  <script type="module" src="/src/viewer.js"></script>
</body>
</html>
