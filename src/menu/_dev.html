<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden} #bg{position:fixed;inset:0;background:#222 url(/src/menu/_bg.png) center/cover}</style></head>
<body>
<div id="bg"></div><div id="title" class="overlay menu"></div>

import '@fontsource/dotgothic16/400.css';

import '/src/menu/menu.css';
import { installPaper } from '/src/ui/paper.js';

installPaper();

const ui = new MenuUI(document.getElementById('title'), { onPick: (id) => { ui.stamp(id); } });

  { id: 'new', label: 'New Game', note: '¥100', icon: 'capsule' },
  { id: 'host', label: 'Host Shop', note: 'ONLINE', icon: 'host' },
  { id: 'join', label: 'Join Friend', note: 'CODE', icon: 'join' },
  { id: 'wardrobe', label: 'Wardrobe', note: '', icon: 'shirt' },
  { id: 'settings', label: 'Settings', note: '', icon: 'gear' },
  { id: 'credits', label: 'Credits', note: 'THANKS', icon: 'heart' },
]);
window.__ui = ui;
window.__ready = true;
</script></body></html>
