<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPCs</title>
  <style>
    html, body { margin: 0; background: #1d1714; color: #f3e9d2; font-family: 'Tiny5', monospace; }
    #grid { display: grid; gap: 10px; padding: 10px; justify-content: start; }
    .cell { display: flex; flex-direction: column; gap: 4px; }
    .cell canvas { display: block; border-radius: 2px; }
    .lbl { font-size: 13px; line-height: 1.15; text-shadow: 0 1px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lbl span { opacity: 0.65; margin-left: 6px; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; }
    #info { position: fixed; left: 8px; bottom: 6px; font-size: 12px; opacity: 0.7; pointer-events: none; }
    #err { position: fixed; top: 0; left: 0; color: #ff8080; white-space: pre; font-size: 12px; z-index: 99; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <div id="stage"></div>
  <div id="info"></div>
  <div id="err"></div>
  <script type="module" src="/src/dev/npc.js"></script>
</body>
</html>
