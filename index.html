<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gacha Garage</title>
  <meta name="description" content="A cozy first-person capsule-toy shop game set in Grandpa's old garage on a quiet back lane." />
  <!-- the tab icon: the shop's red enamel sign (navy rim, cream pin-line, a cream G), 16 x 16 pixels -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='3' y='0' width='1' height='2' fill='%233a3640'/%3E%3Crect x='12' y='0' width='1' height='2' fill='%233a3640'/%3E%3Crect x='0' y='2' width='16' height='13' fill='%231a1216'/%3E%3Crect x='1' y='3' width='14' height='11' fill='%231f2a52'/%3E%3Crect x='2' y='4' width='12' height='9' fill='%23f6e8c8'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%23b3262a'/%3E%3Cpath fill='%23f6e8c8' d='M6 6h4v1H6zM5 7h1v3H5zM6 10h4v1H6zM9 8h2v2H9zM8 8h1v1H8z'/%3E%3C/svg%3E" />
  <link rel="preload" as="image" href="/img/ui/loading-lane.png" />
  <link rel="preload" as="image" href="/img/ui/loading-van.png" />
  <!-- The loading screen (#loading), styled here so it is on screen from the first frame, before any script or 3D:
       Grandpa's van driving down the lane at dusk in pixel art. Two small sheets baked by tools/bake-loading.mjs: the
       van (8 frames from the real model, and its exhaust puff) and the lane (tiling rows: skyline, houses, the wall
       with the poles and wires, the road; plus the signs). Everything is whole texels at a whole-number scale (--s)
       and moves in steps; only transforms animate, so it keeps going while the game builds. Progress is the van's
       trip: its marker along the line on the station-style board, the odometer, and the paper tag's percentage
       (window.__loading.set(0..1), below). Places in the lane sheet: skyline 0+96, houses 96+176, wall 272+212,
       road 484+40, signs from 524. -->
  <style>
    #loading { position: fixed; inset: 0; z-index: 50; overflow: hidden; contain: strict; background: #232140; --s: 2; --ry: 70vh; --pm: 0; --u: calc(1px * var(--s)); }
    #loading, #loading * { image-rendering: pixelated; }
    #loading.out { opacity: 0; transition: opacity .4s steps(4); pointer-events: none; }
    #loading.gone { display: none; }
    @media (min-height: 1000px) and (min-width: 1200px) { #loading { --s: 3; } }
    @media (min-height: 1400px) and (min-width: 1800px) { #loading { --s: 4; } }
    @media (max-height: 480px) { #loading { --ry: 60vh; } }
    @media (orientation: portrait) { #loading { --ry: 62vh; } }
    /* the sky: flat bands, warm at the horizon */
    .ld-sky { position: absolute; left: 0; right: 0; top: 0; height: var(--ry); background: linear-gradient(to top,
      #f6c07a 0 calc(24 * var(--u)), #ee9a70 calc(24 * var(--u)) calc(60 * var(--u)), #cf7480 calc(60 * var(--u)) calc(104 * var(--u)),
      #9a5c8a calc(104 * var(--u)) calc(156 * var(--u)), #6a4c88 calc(156 * var(--u)) calc(220 * var(--u)), #4a3f7c calc(220 * var(--u)) calc(300 * var(--u)),
      #33316a calc(300 * var(--u)) calc(400 * var(--u)), #272a57 calc(400 * var(--u))); }
    /* the lane's rows, scrolling at their own speeds (a texel a step) */
    .ld-l { position: absolute; left: 0; width: calc(100% + 480 * var(--u)); background: url(/img/ui/loading-lane.png) repeat-x;
      background-size: calc(480 * var(--u)) calc(588 * var(--u)); will-change: transform; animation: ld-x 12s steps(480) infinite; }
    @keyframes ld-x { to { transform: translate3d(calc(-480 * var(--u)), 0, 0); } }
    .ld-a { top: calc(var(--ry) - 192 * var(--u)); height: calc(96 * var(--u)); background-position: 0 0; animation-duration: 60s; }
    .ld-b { top: calc(var(--ry) - 190 * var(--u)); height: calc(176 * var(--u)); background-position: 0 calc(-96 * var(--u)); animation-duration: 15s; }
    .ld-c { top: calc(var(--ry) - 212 * var(--u)); height: calc(212 * var(--u)); background-position: 0 calc(-272 * var(--u)); animation-duration: 8s; }
    .ld-d { top: var(--ry); height: calc(40 * var(--u)); background-position: 0 calc(-484 * var(--u)); animation-duration: 5s; box-shadow: 0 calc(2 * var(--u)) 0 #3a3862; }
    /* the van (96 x 60 a frame, its wheels on the road) and the puff from its exhaust */
    .ld-van, .ld-puff { position: absolute; left: 24vw; top: calc(var(--ry) - 33 * var(--u)); width: calc(96 * var(--u)); height: calc(60 * var(--u)); overflow: hidden; }
    .ld-van i, .ld-puff i { display: block; height: 100%; will-change: transform; background: url(/img/ui/loading-van.png) 0 0 / calc(768 * var(--u)) calc(76 * var(--u)); }
    .ld-van i { width: calc(768 * var(--u)); animation: ld-v .56s steps(8) infinite; }
    @keyframes ld-v { to { transform: translate3d(calc(-768 * var(--u)), 0, 0); } }
    .ld-puff { left: calc(24vw - 7 * var(--u)); top: calc(var(--ry) + 7 * var(--u)); width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
    .ld-puff i { width: calc(96 * var(--u)); background-position: 0 calc(-60 * var(--u)); animation: ld-p .72s steps(6) infinite; }
    @keyframes ld-p { to { transform: translate3d(calc(-96 * var(--u)), 0, 0); } }
    /* the station-style board, hung on two wires; the van's marker rides its line */
    .ld-sign { position: absolute; left: calc(50% - 84 * var(--u)); top: calc(9 * var(--u)); width: calc(168 * var(--u)); height: calc(60 * var(--u));
      background: url(/img/ui/loading-lane.png) 0 calc(-524 * var(--u)) / calc(480 * var(--u)) calc(588 * var(--u)); filter: drop-shadow(calc(2 * var(--u)) calc(2 * var(--u)) 0 rgba(20, 16, 32, .45)); }
    .ld-sign::before, .ld-sign::after { content: ''; position: absolute; bottom: 100%; height: calc(10 * var(--u)); width: var(--u); left: calc(30 * var(--u)); background: #1a1420; }
    .ld-sign::after { left: calc(137 * var(--u)); }
    .ld-mk { position: absolute; left: calc((16 + var(--pm)) * var(--u)); top: calc(31 * var(--u)); width: calc(13 * var(--u)); height: calc(9 * var(--u));
      background: url(/img/ui/loading-lane.png) calc(-260 * var(--u)) calc(-554 * var(--u)) / calc(480 * var(--u)) calc(588 * var(--u)); }
    /* the odometer and the paper tag, under the road */
    .ld-hud { position: absolute; left: 0; right: 0; bottom: max(10px, 5vh); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: calc(5 * var(--u)) calc(12 * var(--u)); }
    .ld-odo, .ld-tag { position: relative; flex: none; background: url(/img/ui/loading-lane.png) calc(-316 * var(--u)) calc(-524 * var(--u)) / calc(480 * var(--u)) calc(588 * var(--u)); }
    .ld-odo { width: calc(62 * var(--u)); height: calc(17 * var(--u)); }
    .ld-tag { width: calc(140 * var(--u)); height: calc(26 * var(--u)); background-position: calc(-172 * var(--u)) calc(-524 * var(--u)); rotate: -1.5deg; filter: drop-shadow(calc(2 * var(--u)) calc(2 * var(--u)) 0 rgba(20, 16, 32, .5)); }
    .ld-odo i, .ld-tag i { position: absolute; top: calc(5 * var(--u)); width: calc(5 * var(--u)); height: calc(7 * var(--u)); --d: 0;
      background: url(/img/ui/loading-lane.png) calc((-172 - var(--d) * 6) * var(--u)) calc(-554 * var(--u)) / calc(480 * var(--u)) calc(588 * var(--u)); }
    .ld-odo i:nth-child(1) { left: calc(5 * var(--u)); } .ld-odo i:nth-child(2) { left: calc(14 * var(--u)); } .ld-odo i:nth-child(3) { left: calc(23 * var(--u)); }
    .ld-odo i:nth-child(4) { left: calc(32 * var(--u)); } .ld-odo i:nth-child(5) { left: calc(41 * var(--u)); background-position-y: calc(-564 * var(--u)); }
    .ld-tag i { top: calc(10 * var(--u)); background-position-y: calc(-574 * var(--u)); }
    .ld-tag i:nth-child(1) { left: calc(110 * var(--u)); } .ld-tag i:nth-child(2) { left: calc(116 * var(--u)); } .ld-tag i:nth-child(3) { left: calc(122 * var(--u)); }
    .ld-tag i:nth-child(4) { left: calc(129 * var(--u)); --d: 11; }
    .ld-msg { position: absolute; left: 0; right: 0; bottom: calc(max(10px, 5vh) + 34 * var(--u)); text-align: center; font: 16px/20px 'Alagard', monospace; color: #fff4e0;
      text-shadow: 2px 0 0 #1a1216, -2px 0 0 #1a1216, 0 2px 0 #1a1216, 0 -2px 0 #1a1216, 2px 2px 0 #1a1216, -2px 2px 0 #1a1216, 2px -2px 0 #1a1216, -2px -2px 0 #1a1216; }
    .ld-msg:empty { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="hidden">
    <div id="crosshair"><div class="dot"></div><div class="ring"></div></div>
    <div id="hint"></div>
    <div id="money"><span class="coin" data-icon="coin" data-scale="2"></span><span class="yen">¥</span><span class="val">0</span><span id="money-delta"></span></div>
    <div id="news"></div>
    <div id="caption"></div>
  </div>

  <div id="title" class="overlay menu"></div>

  <div id="loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="ld-sky"></div>
    <div class="ld-l ld-a"></div><div class="ld-l ld-b"></div><div class="ld-l ld-c"></div><div class="ld-l ld-d"></div>
    <div class="ld-puff"><i></i></div>
    <div class="ld-van"><i></i></div>
    <div class="ld-sign"><div class="ld-mk"></div></div>
    <div class="ld-hud"><div class="ld-odo"><i></i><i></i><i></i><i></i><i></i></div><div class="ld-tag"><i></i><i></i><i></i><i></i></div></div>
    <div class="ld-msg" id="load-msg"></div>
  </div>
  <script>
    // the loading screen's progress: the trip so far on the odometer (km, tenths in red), the percentage on the tag, the
    // van's marker along the board's line; msg(text) puts a line under them; done() fades it out for the menu
    (function () {
      var L = document.getElementById('loading'), O = L.querySelectorAll('.ld-odo i'), T = L.querySelectorAll('.ld-tag i'), M = document.getElementById('load-msg'), KM = 318.4;
      function set(p) {
        p = Math.max(0, Math.min(1, +p || 0));
        var km = ('0000' + Math.round(p * KM * 10)).slice(-5), pc = ('  ' + Math.round(p * 100)).slice(-3), i;
        for (i = 0; i < 5; i++) O[i].style.setProperty('--d', km[i]);
        for (i = 0; i < 3; i++) T[i].style.setProperty('--d', pc[i] === ' ' ? 10 : pc[i]);
        L.style.setProperty('--pm', Math.round(p * 126));
        L.setAttribute('aria-valuenow', Math.round(p * 100));
      }
      window.__loading = {
        set: set,
        msg: function (t) { M.textContent = t || ''; },
        done: function (now) { set(1); L.classList.add(now ? 'gone' : 'out'); setTimeout(function () { L.classList.add('gone'); }, 450); },
      };
      set(0);
    })();
  </script>

  <div id="share" class="overlay hidden">
    <div class="panel">
      <button class="x" data-close aria-label="Close" data-icon="close" data-scale="2"></button>
      <div class="panel-title"><span data-icon="share" data-scale="2"></span><span id="share-title">Host your shop</span></div>
      <textarea id="share-code" spellcheck="false" rows="5" placeholder="Paste your friend's code"></textarea>
      <button id="share-act" class="big" data-icon="copy" data-scale="2">Copy code</button>
      <div class="foot" id="share-note"></div>
    </div>
  </div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-knob"></div></div>
    <button class="tb t-use" id="t-use" aria-label="Use" data-icon="hand" data-scale="3"></button>
    <button class="tb t-alt" id="t-alt" aria-label="Inspect" data-icon="eye" data-scale="2"></button>
    <button class="tb t-drop" id="t-drop" aria-label="Drop" data-icon="drop" data-scale="2"></button>
    <button class="tb t-rot" id="t-rot" aria-label="Rotate" data-icon="rotate" data-scale="2"></button>
    <button class="tb t-move" id="t-move" aria-label="Move" data-icon="move" data-scale="2"></button>
    <button class="tb t-pause" id="t-pause" aria-label="Pause" data-icon="pause" data-scale="2"></button>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="panel">
      <button class="x" data-close aria-label="Close" data-icon="close" data-scale="2"></button>
      <div class="panel-title"><span data-icon="gear" data-scale="2"></span>Settings</div>
      <button id="resume-btn" class="big" data-icon="play" data-scale="2">Resume</button>
      <button id="leave-btn" class="hidden" data-icon="home" data-scale="2">Back to menu</button>
      <div class="rows">
        <label><span class="lbl" data-icon="sparkle">Graphics</span>
          <select id="quality">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="ultra">Ultra</option>
          </select>
        </label>
        <label><span class="lbl" data-icon="sound_on">Master volume</span><input type="range" id="vol-master" min="0" max="1" step="0.01" /></label>
        <label><span class="lbl" data-icon="music">Music</span><input type="range" id="vol-music" min="0" max="1" step="0.01" /></label>
        <label><span class="lbl" data-icon="radio">Ambience</span><input type="range" id="vol-amb" min="0" max="1" step="0.01" /></label>
        <label><span class="lbl" data-icon="mouse_left">Mouse sensitivity</span><input type="range" id="sens" min="0.2" max="2.5" step="0.05" /></label>
        <label><span class="lbl" data-icon="eye">Field of view</span><input type="range" id="fov" min="60" max="95" step="1" /></label>
        <label class="row"><span class="lbl" data-icon="info">Show hints</span><input type="checkbox" id="hints" /></label>
        <label class="row"><span class="lbl" data-icon="hand">Show hands</span><input type="checkbox" id="hands" /></label>
      </div>
      <button id="reset-btn" class="danger" data-icon="trash" data-scale="2">Reset save</button>
      <div class="foot credits">Music: "Bossa Antigua", "Senbazuru", "Enter the Party", "Easy Lemon", "Cool Vibes" by Kevin MacLeod (incompetech.com), CC BY 4.0. More music and sounds: Kenney, OpenGameArt and pdsounds.org artists (CC0 / public domain). Full list in CREDITS.txt.</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
